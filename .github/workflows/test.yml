name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest JSON
        run: jq -e . manifest.json > /dev/null

      - name: Model unit tests
        run: node --test tests/model.test.js

      - name: Check required files
        run: |
          for f in manifest.json Model.js Service.qml BarWidget.qml README.md AGENTS.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
